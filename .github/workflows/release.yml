name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin

      - name: Compile schema
        run: glib-compile-schemas schemas/

      - name: Package extension
        run: |
          mkdir -p dist/update-checker@local
          cp -r extension.js prefs.js metadata.json stylesheet.css README.md schemas dist/update-checker@local/
          cd dist
          zip -r update-checker@local.zip update-checker@local

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/update-checker@local.zip
          generate_release_notes: true
