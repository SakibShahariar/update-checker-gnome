name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test and schema tools
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-dev-bin

      - name: Check JavaScript syntax
        run: node --check extension.js && node --check prefs.js && node --check lib/indicator.js && node --check lib/checks.js && node --check lib/updates.js && node --check lib/network-watch.js && node --check lib/utils.js && node --check lib/motion.js && node --check lib/theming.js && node --check tests/utils.test.js

      - name: Validate extension metadata and license
        run: |
          node -e "const fs = require('node:fs'); const m = JSON.parse(fs.readFileSync('metadata.json', 'utf8')); if (m.license !== 'GPL-3.0-only') process.exit(1); if (m.uuid !== 'update-checker@SakibShahariar.github.io') process.exit(1); if (!fs.readFileSync('LICENSE', 'utf8').startsWith('GNU GENERAL PUBLIC LICENSE\\nVersion 3')) process.exit(1)"

      - name: Run utility regression tests
        run: gjs -m tests/utils.test.js

      - name: Validate settings schema
        run: glib-compile-schemas --strict --dry-run schemas/

      - name: Check patch whitespace
        run: git diff --check
