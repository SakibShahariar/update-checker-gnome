name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install schema validation tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin

      - name: Check JavaScript syntax
        run: node --check extension.js && node --check prefs.js && node --check lib/utils.js && node --check lib/theming.js

      - name: Validate extension metadata
        run: |
          node -e "const m = JSON.parse(require('node:fs').readFileSync('metadata.json', 'utf8')); if (m.license !== 'GPL-3.0-only') process.exit(1); if (m.uuid !== 'update-checker@SakibShahariar.github.io') process.exit(1)"
      - name: Check declared license and UUID
        run: test -s LICENSE && grep -q '^GNU GENERAL PUBLIC LICENSE
      - name: Validate settings schema
        run: glib-compile-schemas --strict --dry-run schemas/

      - name: Check patch whitespace
        run: git diff --check
